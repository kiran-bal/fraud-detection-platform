[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-platform"
version = "0.1.0"
description = "Card-fraud detection platform: validated data pipeline, time-ordered evaluation, cost-based thresholds, serving and monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kiran Bal" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "mlflow>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
fraud-fetch = "fraud_platform.data.source:main"
fraud-train = "fraud_platform.train:main"
fraud-score = "fraud_platform.predict:main"
fraud-promote = "fraud_platform.tracking:main"
fraud-compare = "fraud_platform.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["N803", "N806"]  # X / C are conventional in ML code

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: exercises MLflow end to end"]
