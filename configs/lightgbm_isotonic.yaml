name: lightgbm_isotonic
model: lightgbm
params:
  n_estimators: 600
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 50
  scale_pos_weight: 20.0
seed: 42
split: {train: 0.6, valid: 0.2, test: 0.2}
cost: {review_cost: 10.0, loss_multiplier: 1.0}
recall_targets: [0.5, 0.7, 0.8, 0.9]
calibration: isotonic
n_boot: 200
tracking: true
